<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一键复制库</title>
  <script src="./js/namespace.js"></script>
  <script src="./js/config/initial-skin-choice.js?v=5"></script>
</head>
<body class="pn-theme pn-app min-h-screen flex flex-col font-sans pb-16">

  <!-- 文件拖放遮罩 -->
  <div id="drag-overlay" class="pn-drag-overlay hidden fixed inset-0 z-50 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center pointer-events-none transition-all duration-300">
    <div
      class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center gap-4 text-center max-w-sm pointer-events-auto">
      <div>
        <h3 class="text-lg font-bold text-slate-800">释放以导入 <span id="drag-overlay-filename">README.md</span></h3>
        <p class="text-xs text-slate-500 mt-1">拖放文件到这里，即可立刻更新页面上的 Prompt 列表并自动缓存。</p>
      </div>
    </div>
  </div>

  <div id="app-top-bar-root"></div>

  <!-- 主内容容器，宽屏最多三列 -->
  <main class="pn-workspace flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8">
    <div class="pn-classic-brand-area">
      <header class="pn-brand-plaque" data-pn-role="brand" aria-label="Prompt Systems">
        <img class="pn-brand-plaque-logo" data-pn-classic-asset data-pn-asset="branding:prompt-systems-logo.webp?v=2"
          width="1100" height="362" loading="eager" decoding="async" fetchpriority="high"
          alt="PROMPT SYSTEMS — Electronic Research, established 1978">
        <h1 id="classic-brand-subtitle"></h1>
      </header>
      <div class="pn-brand-plaque-controls" aria-label="页面显示设置">
        <button class="pn-brand-plaque-control" type="button" data-pn-skin-toggle
          aria-pressed="false" title="切换为优雅扁平皮肤">换肤</button>
      </div>
    </div>
    <div class="flex flex-col gap-6 w-full">

      <!-- 本地离线模式横幅 -->
      <div id="local-mode-banner"
        class="hidden pn-banner backdrop-blur rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 transition-all duration-300">
        <div class="flex items-center gap-3">
          <div id="local-mode-status-text">
            <h4 class="font-semibold text-slate-800 text-sm">本地离线模式</h4>
            <p class="text-xs text-slate-500 mt-0.5">由于浏览器安全限制，无法自动加载您的 README.md 修改。请拖拽修改后的
              README.md 到此处，或点击导入。</p>
          </div>
        </div>
        <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
          <button id="local-mode-reset-btn"
            class="hidden pn-pressable px-3 py-1.5 pn-button-secondary rounded-xl text-xs font-semibold shadow-sm transition-all">
            重置默认
          </button>
          <input type="file" id="local-file-input" accept=".md" class="hidden"
            >
          <button id="local-import-btn"
            class="pn-pressable px-3.5 py-1.5 pn-button rounded-xl text-xs font-semibold shadow-sm transition-all flex items-center gap-1.5">
            导入
          </button>
        </div>
      </div>


      <!-- 提示词动态列表容器 -->
      <div id="prompts-list-root" class="space-y-4 min-h-[30rem]">
        <!-- 动态卡片和标题渲染位置 -->
      </div>

      <!-- 跨域或加载失败状态 -->
      <div id="error-state" class="pn-error-state hidden flex flex-col items-center justify-center py-16 px-4 bg-rose-50/50 rounded-2xl border border-rose-500/20 shadow-sm text-center">
        <h3 class="text-base font-semibold text-rose-800 mb-2">无法加载同目录的 README.md</h3>
        <p class="text-xs text-slate-500 mt-1 max-w-md mb-6 leading-relaxed">
          由于浏览器的安全策略（CORS 限制），直接双击打开本地 HTML 文件时，网页无法主动读取磁盘上的文件。<br>
          <strong>解决办法：</strong><br>
          1. 运行本地 HTTP 服务器打开此页面（如 <code>python -m http.server</code>）。<br>
          2. 或者直接把同目录下的 <code>README.md</code> 拖拽到本页面任意位置来手动导入。
        </p>
        <div class="flex gap-3 justify-center">
          <button id="error-import-btn"
            class="pn-pressable px-4 py-2 pn-button rounded-xl text-xs font-semibold shadow-md flex items-center gap-1.5">
            手动导入 README.md
          </button>
        </div>
      </div>

    </div>
  </main>



  <!-- 已复制 Markdown 详情弹窗 -->
  <div id="copy-detail-modal" class="hidden fixed inset-0 z-[70] items-center justify-center p-4" role="dialog"
    aria-modal="true" aria-labelledby="copy-detail-modal-title">
    <section class="pn-modal-frame" tabindex="-1">
      <header class="pn-modal-header flex items-center justify-center gap-4 text-center">
        <div class="min-w-0 w-full">
          <h2 id="copy-detail-modal-title" class="text-xl sm:text-2xl font-bold truncate">已复制内容</h2>
        </div>
      </header>
      <div id="copy-detail-modal-content" class="pn-modal-body text-base sm:text-lg leading-relaxed"></div>
      <footer class="pn-modal-footer">
        <button type="button" class="pn-modal-done rounded-md px-5 py-2 font-bold transition-transform">关闭</button>
      </footer>
    </section>
  </div>

  <button id="pn-back-to-top" class="pn-back-to-top" type="button"
    aria-label="回到页面顶部" title="回到页面顶部">
    <span aria-hidden="true"></span>
  </button>

  <!-- 消息提示容器 -->
  <div id="toast-container" class="pn-toast-container fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-md w-full px-4 sm:px-0"></div>

</body>
</html>
