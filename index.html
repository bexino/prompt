    (() => {
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      const constrained = connection && (connection.saveData || /(^|-)2g$/i.test(connection.effectiveType || ''));
      if (constrained) document.documentElement.classList.add('low-bandwidth');
    })();

      <!-- Prompts Dynamic List Container (Space-y-4 for beautiful card spacing) -->

      <!-- Error State for CORS/Load failure -->
      <div id="error-state"
        class="hidden flex flex-col items-center justify-center py-16 px-4 bg-rose-50/50 rounded-2xl border border-rose-500/20 shadow-sm text-center">

          由于浏览器的安全策略（CORS 限制），直接双击打开本地 HTML 文件时，网页无法主动读取磁盘上的文件。<br>
          <strong>解决办法：</strong><br>
          1. 运行本地 HTTP 服务器打开此页面（如 <code>python -m http.server</code>）。<br>

  <!-- Copied Markdown Detail Modal -->
  <div id="copy-detail-modal" class="hidden fixed inset-0 z-[70] items-center justify-center p-4" role="dialog"
    aria-modal="true" aria-labelledby="copy-detail-modal-title">

      </footer>

  <button id="back-to-top-button" class="back-to-top-button" type="button"
    aria-label="回到页面顶部" title="回到页面顶部">
    <span aria-hidden="true"></span>
  </button>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-md w-full px-4 sm:px-0"></div>

  <!-- JavaScript logic -->
  <script>
    // App Global State
    let rawMarkdown = "";
    let parsedItems = [];
    let lazyAssetObserver = null;
    const pageRotationSeed = (() => {
      if (window.crypto?.getRandomValues) {
        const values = new Uint32Array(2);
        window.crypto.getRandomValues(values);
        return `${values[0]}-${values[1]}`;
      }
      return `${Date.now()}-${Math.random()}`;
    })();

    // Helper to get active site configuration
    function getActiveSiteConfig() {
      const urlParams = new URLSearchParams(window.location.search);
      const siteParam = urlParams.get('site');
      if (siteParam === 'fam') {
        return {
          path: './docs/fam.md',
          filename: 'fam.md'
        };
      }
      return {
        path: './README.md',
        filename: 'README.md'
      };
    }

    // Update dynamic texts based on active site configuration
    function updateDynamicTexts() {
      const config = getActiveSiteConfig();
      const dragOverlayFilename = document.getElementById('drag-overlay-filename');
      if (dragOverlayFilename) {
        dragOverlayFilename.textContent = config.filename;
      }
    }

    // Initialize application
    window.addEventListener('DOMContentLoaded', async () => {
      initDragAndDrop();
      initCopyDetailModal();
      initBackToTopButton();
      updateDynamicTexts();

      const brandPlaque = document.querySelector('.brand-plaque');
      if (brandPlaque) {
        const brandRotation = getStablePlaqueRotation('prompt-notebook-brand');
        brandPlaque.style.setProperty('--plaque-rotation', `${brandRotation.rotation}deg`);
        brandPlaque.style.setProperty('--plaque-mobile-rotation', `${brandRotation.mobileRotation}deg`);
        applyStablePlaqueWear(brandPlaque, 'prompt-notebook-brand');
      }

      const config = getActiveSiteConfig();
      console.log("当前尝试请求的完整路径是:", new URL(config.path, window.location.href).href);

      let loadedSuccessfully = false;

      // 1. Try to fetch dynamically from server
      try {
        const timestamp = new Date().getTime();
        const response = await fetch(`${config.path}?t=${timestamp}`);
        if (response.ok) {
          rawMarkdown = await response.text();
          loadedSuccessfully = true;
          // Clean up stored local overrides if server fetch works
          localStorage.removeItem('local_readme_content');
          localStorage.removeItem('local_readme_filename');
          localStorage.removeItem('local_readme_updated');
        } else {
          console.warn(`获取 ${config.filename} 失败，HTTP 状态码:`, response.status);
        }
      } catch (err) {
        console.error(`获取 ${config.filename} 发生错误，将尝试本地存储:`, err);
      }

      // 2. Fallback to localStorage if dynamic fetch failed
      if (!loadedSuccessfully) {
        const storedContent = localStorage.getItem('local_readme_content');
        if (storedContent) {
          rawMarkdown = storedContent;
          loadedSuccessfully = true;
          showImportStatus(true);
        }
      }

      // 3. Render page or show error if both failed
      if (loadedSuccessfully) {
        hideErrorOverlay();
        parseAndRender();
      } else {
        showErrorOverlay();
      }
    });

    // Drag & Drop / File Import Handlers
    let dragCounter = 0;

    function initDragAndDrop() {
      window.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragCounter++;
        const overlay = document.getElementById('drag-overlay');
        if (overlay) overlay.classList.remove('hidden');
      });

      window.addEventListener('dragover', (e) => {
        e.preventDefault();
      });

      window.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter === 0) {
          const overlay = document.getElementById('drag-overlay');
          if (overlay) overlay.classList.add('hidden');
        }
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragCounter = 0;
        const overlay = document.getElementById('drag-overlay');
        if (overlay) overlay.classList.add('hidden');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
          const file = files[0];
          readAndApplyFile(file);
        }
      });
    }

    function readAndApplyFile(file) {
      if (!file.name.endsWith('.md')) {
        showToast('请导入以 .md 结尾的 Markdown 文件', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        const content = event.target.result;
        rawMarkdown = content;
        localStorage.setItem('local_readme_content', content);
        localStorage.setItem('local_readme_filename', file.name);
        localStorage.setItem('local_readme_updated', new Date().toLocaleTimeString());

        parseAndRender();
        showImportStatus(true);
        showToast(`${file.name} 导入成功并已更新`, 'success');
      };
      reader.onerror = () => {
        showToast('读取文件失败，请重试', 'error');
      };
      reader.readAsText(file);
    }

    function showImportStatus(show) {
      const banner = document.getElementById('local-mode-banner');
      if (!banner) return;

      const isFileProtocol = window.location.protocol === 'file:';

      if (isFileProtocol) {
        banner.classList.remove('hidden');
        const statusText = document.getElementById('local-mode-status-text');
        const resetBtn = document.getElementById('local-mode-reset-btn');

        const config = getActiveSiteConfig();

        if (show) {
          const filename = localStorage.getItem('local_readme_filename') || config.filename;
          const time = localStorage.getItem('local_readme_updated') || '';

          if (statusText) {
            statusText.innerHTML = `
              <h4 class="font-semibold text-slate-800 text-sm">已载入自定义配置</h4>
              <p class="text-xs text-slate-500 mt-0.5">正在使用导入的 <strong>${filename}</strong> (更新于 ${time})。更改文件后可重新拖入。</p>
            `;
          }
          if (resetBtn) resetBtn.classList.remove('hidden');
        } else {
          if (statusText) {
            statusText.innerHTML = `
              <h4 class="font-semibold text-slate-800 text-sm">本地离线模式</h4>
              <p class="text-xs text-slate-500 mt-0.5">由于浏览器安全限制，无法自动加载您的 ${config.filename} 修改。请拖拽修改后的 ${config.filename} 到此处，或点击导入。</p>
            `;
          }
          if (resetBtn) resetBtn.classList.add('hidden');
        }
      } else {
        banner.classList.add('hidden');
      }
    }

    function resetDefaultReadme() {
      localStorage.removeItem('local_readme_content');
      localStorage.removeItem('local_readme_filename');
      localStorage.removeItem('local_readme_updated');
      window.location.reload();
    }

    // Inline markdown parser
    function parseInline(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-black text-slate-950">$1</strong>')
        .replace(/\*(.*?)\*/g, '<em class="italic text-slate-900">$1</em>')
        .replace(/`([^`]+)`/g, '<code class="markdown-inline-code text-sm sm:text-base font-mono">$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-800 hover:underline font-bold transition-colors">$1</a>');
    }

    // Convert markdown text block to styled HTML adhering to enlarged HCI typography standards
    function renderMarkdownToHtml(mdText) {
      if (!mdText.trim()) return '';

      const lines = mdText.split('\n');
      const result = [];
      let inList = null;
      let inTable = false;

      function closeList() {
        if (inList) {
          result.push(`</${inList}>`);
          inList = null;
        }
      }

      function closeTable() {
        if (inTable) {
          result.push('</tbody></table></div>');
          inTable = false;
        }
      }

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        let trimmed = line.trim();

        let isQuote = false;
        if (trimmed.startsWith('>')) {
          isQuote = true;
          trimmed = trimmed.replace(/^>\s?/, '');
        }

        if (trimmed === '---' || trimmed === '***') {
          closeList();
          closeTable();
          result.push('<div class="markdown-ribbon-divider" role="separator" aria-hidden="true"></div>');
          continue;
        }

        if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
          closeList();
          const cells = trimmed.split('|').slice(1, -1).map(c => c.trim());
          if (cells.every(c => /^:?-+:?$/.test(c))) continue;

          if (!inTable) {
            inTable = true;
            result.push('<div class="markdown-table-wrap"><table class="markdown-table text-sm sm:text-base text-left"><thead><tr>');
            cells.forEach(c => result.push(`<th class="px-4.5 py-3.5 text-base sm:text-lg">${parseInline(c)}</th>`));
            result.push('</tr></thead><tbody>');
          } else {
            result.push('<tr>');
            cells.forEach(c => result.push(`<td class="px-4.5 py-3.5 leading-relaxed">${parseInline(c)}</td>`));
            result.push('</tr>');
          }
          continue;
        } else {
          closeTable();
        }

        if (trimmed.startsWith('# ')) {
          closeList();
          result.push(`<h1 class="text-5xl sm:text-7xl lg:text-8xl font-black tracking-tighter pride-gradient-text my-8 sm:my-12 leading-none select-none">${parseInline(trimmed.substring(2))}</h1>`);
          continue;
        }
        if (trimmed.startsWith('## ')) {
          closeList();
          result.push(`<h2>${parseInline(trimmed.substring(3))}</h2>`);
          continue;
        }
        if (trimmed.startsWith('### ')) {
          closeList();
          result.push(`<h3>${parseInline(trimmed.substring(4))}</h3>`);
          continue;
        }
        if (trimmed.startsWith('#### ')) {
          closeList();
          result.push(`<h4 class="text-lg sm:text-xl font-bold text-slate-900 my-4">${parseInline(trimmed.substring(5))}</h4>`);
          continue;
        }

        const ulMatch = trimmed.match(/^[-*]\s+(.*)/);
        if (ulMatch) {
          if (inList !== 'ul') {
            closeList();
            inList = 'ul';
            result.push('<ul class="list-disc list-inside space-y-2.5 my-4 text-base sm:text-lg text-slate-800 leading-relaxed">');
          }
          result.push(`<li>${parseInline(ulMatch[1])}</li>`);
          continue;
        }

        const olMatch = trimmed.match(/^(\d+)\.\s+(.*)/);
        if (olMatch) {
          if (inList !== 'ol') {
            closeList();
            inList = 'ol';
            result.push('<ol class="list-decimal list-inside space-y-2.5 my-4 text-base sm:text-lg text-slate-800 leading-relaxed">');
          }
          result.push(`<li value="${Number.parseInt(olMatch[1], 10)}">${parseInline(olMatch[2])}</li>`);
          continue;
        }

        closeList();

        if (trimmed) {
          const inlineContent = parseInline(trimmed);
          if (isQuote) {
            result.push(`<blockquote class="markdown-quote text-base sm:text-lg italic">${inlineContent}</blockquote>`);
          } else {
            result.push(`<p class="text-base sm:text-lg text-slate-800 my-3 leading-relaxed">${inlineContent}</p>`);
          }
        }
      }

      closeList();
      closeTable();
      return result.join('');
    }

    // Markdown Parser: H2 for category separators, H3 for subheadings, formatted text, and copyable prompt code blocks
    function parseMarkdown(mdText) {
      const lines = mdText.split(/\r?\n/);
      const items = [];
      let pendingTextLines = [];
      let lastHeadingTitle = "";

      function flushPendingText() {
        if (pendingTextLines.length === 0) return;
        const html = renderMarkdownToHtml(pendingTextLines.join('\n'));
        if (html.trim()) {
          items.push({ type: 'html', content: html });
        }
        pendingTextLines = [];
      }

      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        const cleanLine = line.trim();

        if (cleanLine === '[TOC]') {
          flushPendingText();
          items.push({ type: 'toc' });
          i++;
          continue;
        }

        // Match Code Block: ```
        if (/^`{3}(?!`)/.test(cleanLine)) {
          flushPendingText();
          const codeLines = [];
          i++;
          while (i < lines.length) {
            if (/^`{3}(?!`)/.test(lines[i].trim())) {
              i++;
              break;
            }
            codeLines.push(lines[i]);
            i++;
          }
          const code = codeLines.join('\n');

          let title = lastHeadingTitle || "一键复制 Prompt";
          if (items.length > 0 && items[items.length - 1].type === 'h3_heading') {
            title = items[items.length - 1].title;
            items.pop();
          }

          items.push({ type: 'prompt', title, code });
          lastHeadingTitle = "";
          continue;
        }

        // The page title is already rendered as the leather masthead.
        if (cleanLine.startsWith('# ') && !cleanLine.startsWith('## ')) {
          flushPendingText();
          i++;
          continue;
        }

        if (cleanLine === '---' || cleanLine === '***') {
          flushPendingText();
          items.push({
            type: 'divider',
            content: '<div class="markdown-ribbon-divider" role="separator" aria-hidden="true"></div>'
          });
          i++;
          continue;
        }

        // Match Level 2 Heading (## Category)
        if (cleanLine.startsWith('## ')) {
          flushPendingText();
          const title = cleanLine.substring(3).trim();
          items.push({ type: 'h2', title });
          lastHeadingTitle = title;
          i++;
          continue;
        }

        // Match Level 3 Heading (### Title)
        if (cleanLine.startsWith('### ')) {
          flushPendingText();
          const title = cleanLine.substring(4).trim();
          items.push({ type: 'h3_heading', title });
          lastHeadingTitle = title;
          i++;
          continue;
        }

        pendingTextLines.push(line);
        i++;
      }

      flushPendingText();
      return { items };
    }

    // Core parsing and rendering controller
    function parseAndRender() {
      const parsed = parseMarkdown(rawMarkdown);
      parsedItems = parsed.items;
      updateBrandSubtitle(rawMarkdown);
      renderExplorer();
    }

    function updateBrandSubtitle(markdown) {
      const subtitle = document.getElementById('brand-subtitle');
      if (!subtitle) return;
      const titleMatch = markdown.match(/^\s*#\s+(.+?)\s*$/m);
      subtitle.innerHTML = titleMatch ? parseInline(titleMatch[1].trim()) : '';
      const plaque = subtitle.closest('.brand-plaque');
      if (plaque && subtitle.textContent.trim()) {
        plaque.setAttribute('aria-label', `Prompt Systems — ${subtitle.textContent.trim()}`);
      }
    }

    // Smooth Scroll Helper
    function scrollToSection(event, id) {
      if (event) event.preventDefault();
      const el = document.getElementById(id);
      if (el) {
        const headerOffset = 40;
        const elementPosition = el.getBoundingClientRect().top;
        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

        window.scrollTo({
          top: offsetPosition,
          behavior: "smooth"
        });
      }
    }

    function initBackToTopButton() {
      const button = document.getElementById('back-to-top-button');
      if (!button || button.dataset.initialized === 'true') return;
      button.dataset.initialized = 'true';

      let scrollFrame = null;
      const updateVisibility = () => {
        scrollFrame = null;
        const isVisible = window.scrollY > 96;
        button.classList.toggle('is-visible', isVisible);
        button.tabIndex = isVisible ? 0 : -1;
        button.setAttribute('aria-hidden', isVisible ? 'false' : 'true');
      };

      window.addEventListener('scroll', () => {
        if (scrollFrame !== null) return;
        scrollFrame = window.requestAnimationFrame(updateVisibility);
      }, { passive: true });
      updateVisibility();

      button.addEventListener('click', () => {
        const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({
          top: 0,
          left: 0,
          behavior: reduceMotion ? 'auto' : 'smooth'
        });
      });
    }

    // A fresh page seed changes rotations on every visit while keeping this render stable.
    function hashString(value) {
      let hash = 2166136261;
      for (let i = 0; i < value.length; i++) {
        hash ^= value.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function getBalancedTocToneFlags(categories) {
      const count = categories.length;
      if (count === 0) return [];

      const categoryKey = categories.map(item => item.title).join('\n');
      let randomState = hashString(`${pageRotationSeed}:toc-tone-shuffle:${categoryKey}`) || 0x9e3779b9;
      const nextRandom = () => {
        randomState ^= randomState << 13;
        randomState ^= randomState >>> 17;
        randomState ^= randomState << 5;
        return randomState >>> 0;
      };

      const shuffledIndexes = Array.from({ length: count }, (_, index) => index);
      for (let index = count - 1; index > 0; index--) {
        const swapIndex = nextRandom() % (index + 1);
        [shuffledIndexes[index], shuffledIndexes[swapIndex]] = [shuffledIndexes[swapIndex], shuffledIndexes[index]];
      }

      const deepCount = Math.floor(count / 2) + (count % 2 === 1 && (nextRandom() & 1) === 1 ? 1 : 0);
      const flags = Array(count).fill(false);
      shuffledIndexes.slice(0, deepCount).forEach(index => {
        flags[index] = true;
      });
      return flags;
    }

    function getStableNoteLayout(key) {
      const hash = hashString(key);
      const rotationHash = hashString(`${pageRotationSeed}:note:${key}`);
      const copyTabRotationHash = hashString(`${pageRotationSeed}:copy-tab:${key}`);
      const copyTabOffsetHash = hashString(`${pageRotationSeed}:copy-tab-offset:${key}`);
      const decorationHash = hashString(`${pageRotationSeed}:decoration:${key}`);
      let rotation = -5 + ((rotationHash % 1001) / 1000) * 10;
      const copyTabRotation = -5 + ((copyTabRotationHash % 1001) / 1000) * 10;
      const copyTabOffsetX = copyTabOffsetHash % 7;
      const copyTabOffsetY = -((copyTabOffsetHash >>> 8) % 7);
      if (Math.abs(rotation) < 0.7) {
        rotation = (rotationHash & 1) === 0 ? -1.1 : 1.1;
      }

      return {
        rotation: rotation.toFixed(2),
        mobileRotation: rotation.toFixed(2),
        copyTabRotation: copyTabRotation.toFixed(2),
        copyTabOffsetX,
        copyTabOffsetY,
        offsetX: ((hash >>> 11) % 27) - 13,
        offsetY: ((hash >>> 16) % 21) - 10,
        originX: 47 + ((hash >>> 19) % 7),
        originY: 48 + ((hash >>> 22) % 8),
        shadowX: -6 + ((hash >>> 3) % 13),
        shadowY: 10 + ((hash >>> 6) % 9),
        shadowBlur: 5 + ((hash >>> 9) % 6),
        shadowOpacity: (0.58 + ((hash >>> 13) % 15) / 100).toFixed(2),
        contactShadowOpacity: (0.64 + ((hash >>> 18) % 17) / 100).toFixed(2),
        paperBrightness: (0.94 + ((hash >>> 24) % 6) / 100).toFixed(2),
        paperHoverBrightness: (0.98 + ((hash >>> 24) % 5) / 100).toFixed(2),
        topShadowVariant: (hash >>> 5) % 3,
        topShadowOpacity: (0.18 + ((hash >>> 18) % 21) / 100).toFixed(2),
        decoration: decorationHash % 10
      };
    }

    function getVisitNoteColor(index, themes) {
      const groupIndex = Math.floor(index / themes.length);
      let randomState = hashString(`${pageRotationSeed}:note-colors:${groupIndex}`) || 0x9e3779b9;
      const shuffledThemes = [...themes];

      const nextRandom = () => {
        randomState ^= randomState << 13;
        randomState ^= randomState >>> 17;
        randomState ^= randomState << 5;
        return randomState >>> 0;
      };

      for (let themeIndex = shuffledThemes.length - 1; themeIndex > 0; themeIndex--) {
        const swapIndex = nextRandom() % (themeIndex + 1);
        [shuffledThemes[themeIndex], shuffledThemes[swapIndex]] = [shuffledThemes[swapIndex], shuffledThemes[themeIndex]];
      }

      return shuffledThemes[index % themes.length];
    }

    function getStablePlaqueRotation(key) {
      const hash = hashString(`${pageRotationSeed}:plaque:${key}`);
      let rotation = -5 + ((hash % 1001) / 1000) * 10;
      if (Math.abs(rotation) < 1.2) {
        rotation = (hash & 1) === 0 ? -1.2 : 1.2;
      }

      return {
        rotation: rotation.toFixed(2),
        mobileRotation: (rotation * 0.65).toFixed(2)
      };
    }

    function applyStableRibbonRotations(scope, namespace = 'page') {
      scope.querySelectorAll('.markdown-ribbon-divider').forEach((ribbon, index) => {
        const hash = hashString(`${pageRotationSeed}:ribbon:${namespace}:${index}`);
        const rotation = -5 + ((hash % 1001) / 1000) * 10;
        ribbon.style.setProperty('--ribbon-rotation', `${rotation.toFixed(2)}deg`);
      });
    }

    function getStablePlaqueWear(key) {
      let state = hashString(`plaque-wear:${key}`);
      const random = () => {
        state += 0x6D2B79F5;
        let value = state;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
      const between = (min, max) => min + random() * (max - min);

      return {
        aX: between(7, 31).toFixed(1),
        aY: between(19, 79).toFixed(1),
        aSize: between(4.5, 9).toFixed(1),
        aChip2Size: between(1.4, 3.6).toFixed(1),
        aAlpha: between(0.32, 0.55).toFixed(2),
        aLightAlpha: between(0.15, 0.31).toFixed(2),
        aChipDx: between(-3.2, 3.2).toFixed(1),
        aChipDy: between(-11, 11).toFixed(1),
        aChip2Dx: between(-3, 3).toFixed(1),
        aChip2Dy: between(-10, 10).toFixed(1),
        bX: between(38, 76).toFixed(1),
        bY: between(22, 82).toFixed(1),
        bSize: between(6, 11.5).toFixed(1),
        bChip2Size: between(1.6, 4.2).toFixed(1),
        bAlpha: between(0.35, 0.58).toFixed(2),
        bLightAlpha: between(0.16, 0.32).toFixed(2),
        bChipDx: between(-3.2, 3.2).toFixed(1),
        bChipDy: between(-12, 12).toFixed(1),
        bChip2Dx: between(-3, 3).toFixed(1),
        bChip2Dy: between(-10, 10).toFixed(1),
        cX: between(78, 94).toFixed(1),
        cY: between(18, 76).toFixed(1),
        cSize: between(3, 6.5).toFixed(1),
        cAlpha: between(0.2, 0.38).toFixed(2),
        scratchAngle: between(166, 188).toFixed(1),
        scratchStop: between(28, 72).toFixed(1),
        scratch2Angle: between(82, 108).toFixed(1),
        scratch2Stop: between(24, 76).toFixed(1)
      };
    }

    function applyStablePlaqueWear(element, key) {
      if (!element) return;
      const wear = getStablePlaqueWear(key);
      element.style.setProperty('--wear-a-x', `${wear.aX}%`);
      element.style.setProperty('--wear-a-y', `${wear.aY}%`);
      element.style.setProperty('--wear-a-size', `${wear.aSize}px`);
      element.style.setProperty('--wear-a-chip-size', `${(Number(wear.aSize) * 0.46).toFixed(1)}px`);
      element.style.setProperty('--wear-a-chip2-size', `${wear.aChip2Size}px`);
      element.style.setProperty('--wear-a-alpha', wear.aAlpha);
      element.style.setProperty('--wear-a-light-alpha', wear.aLightAlpha);
      element.style.setProperty('--wear-a-chip-dx', `${wear.aChipDx}%`);
      element.style.setProperty('--wear-a-chip-dy', `${wear.aChipDy}%`);
      element.style.setProperty('--wear-a-chip2-dx', `${wear.aChip2Dx}%`);
      element.style.setProperty('--wear-a-chip2-dy', `${wear.aChip2Dy}%`);
      element.style.setProperty('--wear-b-x', `${wear.bX}%`);
      element.style.setProperty('--wear-b-y', `${wear.bY}%`);
      element.style.setProperty('--wear-b-size', `${wear.bSize}px`);
      element.style.setProperty('--wear-b-chip-size', `${(Number(wear.bSize) * 0.42).toFixed(1)}px`);
      element.style.setProperty('--wear-b-chip2-size', `${wear.bChip2Size}px`);
      element.style.setProperty('--wear-b-alpha', wear.bAlpha);
      element.style.setProperty('--wear-b-light-alpha', wear.bLightAlpha);
      element.style.setProperty('--wear-b-chip-dx', `${wear.bChipDx}%`);
      element.style.setProperty('--wear-b-chip-dy', `${wear.bChipDy}%`);
      element.style.setProperty('--wear-b-chip2-dx', `${wear.bChip2Dx}%`);
      element.style.setProperty('--wear-b-chip2-dy', `${wear.bChip2Dy}%`);
      element.style.setProperty('--wear-c-x', `${wear.cX}%`);
      element.style.setProperty('--wear-c-y', `${wear.cY}%`);
      element.style.setProperty('--wear-c-size', `${wear.cSize}px`);
      element.style.setProperty('--wear-c-alpha', wear.cAlpha);
      element.style.setProperty('--wear-scratch-angle', `${wear.scratchAngle}deg`);
      element.style.setProperty('--wear-scratch-stop', `${wear.scratchStop}%`);
      element.style.setProperty('--wear-scratch2-angle', `${wear.scratch2Angle}deg`);
      element.style.setProperty('--wear-scratch2-stop', `${wear.scratch2Stop}%`);
    }

    function getNoteDecoration(decoration) {
      const decorations = {
        0: { className: 'tape', src: './assets/decor/masking-tape.webp' },
        1: { className: 'pin', src: './assets/decor/brass-pin.webp' },
        2: { className: 'tape', src: './assets/decor/masking-tape.webp' },
        3: { className: 'pin', src: './assets/decor/brass-pin.webp' }
      };
      return decorations[decoration] || null;
    }

    function getNotePaper(variant, colorTheme, shadowVariant) {
      const paperVariant = ['a', 'b', 'c'][variant % 3];
      const colorName = colorTheme.replace('pride-card-', '');
      return {
        variant: paperVariant,
        base: `./assets/notes/note-paper-${paperVariant}-${colorName}.webp?v=3`,
        topShadow: `./assets/notes/note-top-shadow-${paperVariant}-${shadowVariant}.webp?v=1`
      };
    }

    // Dynamic rendering of flat Prompt Explorer list as Responsive Square Card Grid with Pride Solid Color Themes
    function renderExplorer() {
      const root = document.getElementById('prompts-list-root');
      if (!root) return;
      root.innerHTML = "";

      const prideColorThemes = [
        'pride-card-red',
        'pride-card-orange',
        'pride-card-yellow',
        'pride-card-green',
        'pride-card-blue',
        'pride-card-purple'
      ];
      let promptCounter = 0;

      let i = 0;
      while (i < parsedItems.length) {
        const item = parsedItems[i];

        if (item.type === 'toc') {
          const categories = parsedItems.filter(it => it.type === 'h2');
          if (categories.length > 0) {
            const tocEl = document.createElement('div');
            tocEl.className = "catalog-panel p-6 sm:p-8 my-6 select-none w-full";

            let tocHtml = `
              <div class="flex items-center gap-2 text-sm sm:text-base font-bold text-slate-500 uppercase tracking-wider mb-4">
                目录
              </div>
              <div class="toc-list">
            `;

            const tocToneFlags = getBalancedTocToneFlags(categories);

            categories.forEach((catItem, categoryIndex) => {
              const catIdx = parsedItems.indexOf(catItem);
              const toneClass = tocToneFlags[categoryIndex] ? ' toc-item-deep' : '';
              tocHtml += `
                <a href="#category-${catIdx}" data-target="category-${catIdx}"
                  class="toc-item-link${toneClass} px-6 sm:px-7 py-4 rounded-2xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-900 hover:text-slate-950 transition-all text-base sm:text-lg font-extrabold group shadow-xs">
                  <span class="toc-label">${parseInline(catItem.title)}</span>
                  <span class="toc-arrow group-hover:translate-x-1 transition-transform shrink-0">→</span>
                </a>
              `;
            });

            tocHtml += `</div>`;
            tocEl.innerHTML = tocHtml;

            tocEl.querySelectorAll('.toc-item-link').forEach(link => {
              link.addEventListener('click', (e) => {
                const targetId = link.getAttribute('data-target');
                scrollToSection(e, targetId);
              });
            });

            root.appendChild(tocEl);
          }
          i++;
        } else if (item.type === 'h2') {
          const h2El = document.createElement('h2');
          const plaqueRotation = getStablePlaqueRotation(item.title);
          h2El.className = "section-plaque text-2xl sm:text-3xl font-extrabold select-none";
          h2El.id = `category-${i}`;
          h2El.style.setProperty('--plaque-rotation', `${plaqueRotation.rotation}deg`);
          h2El.style.setProperty('--plaque-mobile-rotation', `${plaqueRotation.mobileRotation}deg`);
          applyStablePlaqueWear(h2El, item.title);
          h2El.innerHTML = parseInline(item.title);
          root.appendChild(h2El);
          i++;
        } else if (item.type === 'h3_heading') {
          const h3El = document.createElement('h3');
          h3El.className = "subheading-slip text-lg sm:text-xl font-bold mt-8 mb-4 select-none w-full";
          h3El.innerHTML = parseInline(item.title);
          root.appendChild(h3El);
          i++;
        } else if (item.type === 'divider') {
          const dividerEl = document.createElement('div');
          dividerEl.className = "prose-divider-only w-full";
          dividerEl.innerHTML = item.content;
          root.appendChild(dividerEl);
          i++;
        } else if (item.type === 'html') {
          const div = document.createElement('div');
          div.className = "prose-paper text-base sm:text-lg leading-relaxed my-3 w-full";
          div.innerHTML = item.content;
          root.appendChild(div);
          i++;
        } else if (item.type === 'prompt') {
          // Collect consecutive prompt cards into a responsive grid (2 columns on mobile, max 3 columns on web)
          const promptGroup = [];
          while (i < parsedItems.length && parsedItems[i].type === 'prompt') {
            promptGroup.push({ item: parsedItems[i], idx: i });
            i++;
          }

          const gridEl = document.createElement('div');
          gridEl.className = "notes-grid grid grid-cols-2 sm:grid-cols-3 my-5 w-full";

          promptGroup.forEach(({ item: promptItem, idx: promptIdx }) => {
            const promptId = `prompt-${promptIdx}`;
            const promptEl = document.createElement('div');

            const colorTheme = getVisitNoteColor(promptCounter, prideColorThemes);
            promptCounter++;

            const noteLayout = getStableNoteLayout(`${promptItem.title}\n${promptItem.code}`);
            const decoration = getNoteDecoration(noteLayout.decoration);
            const paperAsset = getNotePaper((promptCounter - 1) % 3, colorTheme, noteLayout.topShadowVariant);

            promptEl.className = `group/card pride-card note-card note-paper-${paperAsset.variant} ${colorTheme} aspect-square p-3.5 sm:p-5 lg:p-6 flex flex-col justify-between cursor-pointer relative select-none btn-scale`;
            promptEl.id = promptId;
            promptEl.style.setProperty('--note-rotation', `${noteLayout.rotation}deg`);
            promptEl.style.setProperty('--note-mobile-rotation', `${noteLayout.mobileRotation}deg`);
            promptEl.style.setProperty('--note-tab-rotation', `${noteLayout.copyTabRotation}deg`);
            promptEl.style.setProperty('--note-tab-offset-x', `${noteLayout.copyTabOffsetX}px`);
            promptEl.style.setProperty('--note-tab-offset-y', `${noteLayout.copyTabOffsetY}px`);
            promptEl.style.setProperty('--note-x', `${noteLayout.offsetX}px`);
            promptEl.style.setProperty('--note-y', `${noteLayout.offsetY}px`);
            promptEl.style.setProperty('--note-origin-x', `${noteLayout.originX}%`);
            promptEl.style.setProperty('--note-origin-y', `${noteLayout.originY}%`);
            promptEl.style.setProperty('--note-shadow-x', `${noteLayout.shadowX}px`);
            promptEl.style.setProperty('--note-shadow-y', `${noteLayout.shadowY}px`);
            promptEl.style.setProperty('--note-shadow-blur', `${noteLayout.shadowBlur}px`);
            promptEl.style.setProperty('--note-shadow-opacity', noteLayout.shadowOpacity);
            promptEl.style.setProperty('--note-contact-shadow-opacity', noteLayout.contactShadowOpacity);
            promptEl.style.setProperty('--note-paper-brightness', noteLayout.paperBrightness);
            promptEl.style.setProperty('--note-paper-hover-brightness', noteLayout.paperHoverBrightness);
            promptEl.style.setProperty('--note-top-shadow-opacity', noteLayout.topShadowOpacity);

            promptEl._promptCode = promptItem.code;
            promptEl._promptTitle = promptItem.title;

            promptEl.innerHTML = `
              <div class="note-paper-visual" aria-hidden="true">
                <img class="note-paper-base lazy-asset" data-src="${paperAsset.base}" loading="lazy" decoding="async" fetchpriority="low" alt="">
                <img class="note-top-shadow lazy-asset" data-src="${paperAsset.topShadow}" loading="lazy" decoding="async" fetchpriority="low" alt="">
              </div>
              ${decoration ? `<img class="note-decoration note-decoration-${decoration.className} lazy-asset" data-src="${decoration.src}" loading="lazy" decoding="async" fetchpriority="low" alt="" aria-hidden="true">` : ''}
              <div class="card-content-wrap flex flex-col h-full w-full">
                <div class="w-full text-left overflow-hidden">
                  <h3 class="text-lg sm:text-xl md:text-2xl lg:text-2xl font-black line-clamp-4 sm:line-clamp-5 leading-snug tracking-tight break-words">
                    ${parseInline(promptItem.title)}
                  </h3>
                </div>
              </div>
              <button type="button" class="note-copy-tab select-none" aria-label="复制提示词；复制成功后可查看详情">
                <span class="note-copy-label-default">复制</span>
                <span class="note-copy-label-success">查看</span>
              </button>
              <div class="copied-overlay absolute inset-0 flex items-center justify-center pointer-events-none select-none">
                <img class="copied-sticker-image" src="./assets/decor/copied-sticker-v6.webp?v=7" width="512" height="512" decoding="async" alt="">
              </div>
            `;

            promptEl.querySelector('.note-copy-tab')?.addEventListener('click', event => {
              if (promptEl.classList.contains('copied')) {
                event.stopPropagation();
                openCopyDetails(promptEl._promptTitle, promptEl._promptCode);
              }
            });

            promptEl.addEventListener('click', () => {
              copyPromptCard(promptEl._promptCode, promptId, promptEl._promptTitle);
            });

            gridEl.appendChild(promptEl);
          });

          root.appendChild(gridEl);
        } else {
          i++;
        }
      }
      initializeLazyAssets(root);
    }

    function initializeLazyAssets(scope) {
      if (lazyAssetObserver) lazyAssetObserver.disconnect();

      applyStableRibbonRotations(scope);

      const targets = [
        ...scope.querySelectorAll('.lazy-asset[data-src]'),
        ...scope.querySelectorAll('.markdown-ribbon-divider:not(.lazy-bg-loaded)')
      ];

      const loadTarget = target => {
        if (target.classList.contains('markdown-ribbon-divider')) {
          target.classList.add('lazy-bg-loaded');
          return;
        }

        const source = target.dataset.src;
        if (!source) return;
        if (target.classList.contains('note-paper-base')) {
          const card = target.closest('.note-card');
          const markReady = () => card?.classList.add('note-assets-ready');
          target.addEventListener('load', markReady, { once: true });
          target.addEventListener('error', () => card?.classList.add('note-assets-failed'), { once: true });
        }
        target.src = source;
        target.removeAttribute('data-src');
        if (target.classList.contains('note-paper-base') && target.complete && target.naturalWidth > 0) {
          target.closest('.note-card')?.classList.add('note-assets-ready');
        }
      };

      if (!('IntersectionObserver' in window)) {
        targets.forEach(loadTarget);
        return;
      }

      lazyAssetObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          loadTarget(entry.target);
          lazyAssetObserver.unobserve(entry.target);
        });
      }, {
        rootMargin: document.documentElement.classList.contains('low-bandwidth') ? '220px 0px' : '700px 0px',
        threshold: 0.01
      });

      targets.forEach(target => lazyAssetObserver.observe(target));
    }

    // Clipboard Copy Execution with Synchronous 0ms INSTANT UI Feedback
    function copyPromptCard(text, promptId, title) {
      const cardEl = document.getElementById(promptId);

      // 1. INSTANT UI FEEDBACK (0ms synchronous execution!)
      showCopyFeedback(cardEl, title);

      // 2. Clipboard API execution in background
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .catch(err => {
            console.error('Clipboard copy error: ', err);
            showToast('复制失败，请尝试手动复制', 'error');
          });
      } else {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          const copied = document.execCommand('copy');
          document.body.removeChild(textarea);
          if (!copied) throw new Error('Fallback copy command returned false');
        } catch (err) {
          console.error('Fallback copy failed: ', err);
          showToast('复制失败，请尝试手动复制', 'error');
        }
      }
    }

    // Clipboard UI feedback controller: show the generated sticker immediately while preserving the note color.
    function showCopyFeedback(cardEl, title) {
      if (!cardEl) return;

      if (cardEl.copyTimeout) {
        clearTimeout(cardEl.copyTimeout);
      }

      const stickerEl = cardEl.querySelector('.copied-sticker-image');
      if (stickerEl) {
        const rotationDirection = Math.random() < 0.5 ? -1 : 1;
        const stickerRotation = rotationDirection * (8 + Math.random() * 7);
        const stickerOffsetX = -16 + Math.random() * 32;
        const stickerOffsetY = -16 + Math.random() * 32;
        stickerEl.style.transform = `translate(${stickerOffsetX.toFixed(2)}px, ${stickerOffsetY.toFixed(2)}px) rotate(${stickerRotation.toFixed(2)}deg)`;
        stickerEl.style.animation = 'none';
        void stickerEl.offsetWidth;
        stickerEl.style.removeProperty('animation');
      }

      cardEl.classList.add('copied');

      cardEl.copyTimeout = setTimeout(() => {
        cardEl.classList.remove('copied');
      }, 2000);
    }

    function initCopyDetailModal() {
      const modal = document.getElementById('copy-detail-modal');
      if (!modal || modal.dataset.initialized === 'true') return;
      modal.dataset.initialized = 'true';

      modal.querySelectorAll('.copy-detail-modal-done').forEach(button => {
        button.addEventListener('click', closeCopyDetails);
      });
      modal.addEventListener('click', event => {
        if (event.target === modal) closeCopyDetails();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
          closeCopyDetails();
        }
      });
    }

    function openCopyDetails(title, markdown) {
      const modal = document.getElementById('copy-detail-modal');
      const titleEl = document.getElementById('copy-detail-modal-title');
      const contentEl = document.getElementById('copy-detail-modal-content');
      if (!modal || !titleEl || !contentEl) return;

      titleEl.textContent = title || '已复制内容';
      const rendered = renderMarkdownToHtml(markdown || '');
      contentEl.innerHTML = rendered || '<p>复制内容为空。</p>';
      applyStableRibbonRotations(contentEl, `copy:${title || ''}`);
      contentEl.querySelectorAll('.markdown-ribbon-divider').forEach(ribbon => {
        ribbon.classList.add('lazy-bg-loaded');
      });
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.classList.add('copy-detail-open');
      modal.querySelector('.copy-detail-modal-frame')?.focus();
    }

    function closeCopyDetails() {
      const modal = document.getElementById('copy-detail-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.classList.remove('copy-detail-open');
    }

    // Toast Alert Manager
    function showToast(message, type = 'success', subtitle = '') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');

      toast.className = `
        flex items-start justify-between gap-3 p-4.5 rounded-2xl shadow-lg border backdrop-blur-md transform translate-y-2 opacity-0 transition-all duration-300 ease-out max-w-sm w-full
        ${type === 'success'
          ? 'pride-gradient-bg text-white border-transparent shadow-md shadow-orange-500/5'
          : 'bg-white/95 border-rose-500/30 text-slate-800 shadow-rose-500/5'}
      `;

      toast.innerHTML = `
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold leading-relaxed">${message}</p>
          ${subtitle ? `<p class="text-xs ${type === 'success' ? 'text-white/80' : 'text-slate-400'} mt-0.5 truncate">${subtitle}</p>` : ''}
        </div>
        <button class="${type === 'success' ? 'text-white/80 hover:text-white' : 'text-slate-400 hover:text-slate-600'} transition-colors font-bold text-sm" onclick="this.parentElement.remove()">
          &times;
        </button>
      `;

      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        toast.addEventListener('transitionend', () => {
          toast.remove();
        });
      }, 3500);
    }

    function showErrorOverlay() {
      const errorState = document.getElementById('error-state');
      const root = document.getElementById('prompts-list-root');
      if (!errorState) return;

      const config = getActiveSiteConfig();
      const errorTitle = errorState.querySelector('h3');
      if (errorTitle) errorTitle.textContent = `无法加载同目录的 ${config.filename}`;

      const errorDesc = errorState.querySelector('p');
      if (errorDesc) {
        errorDesc.innerHTML = `
          由于浏览器的安全策略（CORS 限制），直接双击打开本地 HTML 文件时，网页无法主动读取磁盘上的文件。<br>
          <strong>解决办法：</strong><br>
          1. 运行本地 HTTP 服务器打开此页面（如 <code>python -m http.server</code>）。<br>
          2. 或者直接把同目录下的 <code>${config.filename}</code> 拖拽到本页面任意位置来手动导入。
        `;
      }

      const errorBtn = errorState.querySelector('button');
      if (errorBtn) {
        errorBtn.textContent = `手动导入 ${config.filename}`;
      }

      errorState.classList.remove('hidden');
      if (root) root.classList.add('hidden');
      showImportStatus(false);
    }

    function hideErrorOverlay() {
      const errorState = document.getElementById('error-state');
      const root = document.getElementById('prompts-list-root');

      if (errorState) errorState.classList.add('hidden');
      if (root) root.classList.remove('hidden');
    }
  </script>
