<body class="bg-white text-slate-800 min-h-screen flex flex-col font-sans pb-16">

  <!-- Drag and Drop Overlay -->
  <div id="drag-overlay"
    class="hidden fixed inset-0 z-50 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center pointer-events-none transition-all duration-300"
    style="border: 6px dashed; border-image: linear-gradient(135deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7) 1;">
    <div
      class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center gap-4 text-center max-w-sm pointer-events-auto">
      <div>
        <h3 class="text-lg font-bold text-slate-800">释放以导入 <span id="drag-overlay-filename">README.md</span></h3>
        <p class="text-xs text-slate-500 mt-1">拖放文件到这里，即可立刻更新页面上的 Prompt 列表并自动缓存。</p>
      </div>
    </div>
  </div>

  <!-- Main Container (Responsive 3-Column Max Grid Layout) -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-col gap-6 w-full">

      <!-- Local Offline Mode Banner -->
      <div id="local-mode-banner"
        class="hidden pride-banner backdrop-blur rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 transition-all duration-300">
        <div class="flex items-center gap-3">
          <div id="local-mode-status-text">
            <h4 class="font-semibold text-slate-800 text-sm">本地离线模式</h4>
            <p class="text-xs text-slate-500 mt-0.5">由于浏览器安全限制，无法自动加载您的 README.md 修改。请拖拽修改后的
              README.md 到此处，或点击导入。</p>
          </div>
        </div>
        <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
          <button id="local-mode-reset-btn" onclick="resetDefaultReadme()"
            class="hidden btn-scale px-3 py-1.5 pride-btn-secondary rounded-xl text-xs font-semibold shadow-sm transition-all">
            重置默认
          </button>
          <input type="file" id="local-file-input" accept=".md" class="hidden"
            onchange="if(this.files.length) readAndApplyFile(this.files[0])">
          <button onclick="document.getElementById('local-file-input').click()"
            class="btn-scale px-3.5 py-1.5 pride-btn rounded-xl text-xs font-semibold shadow-sm transition-all flex items-center gap-1.5">
            导入
          </button>
        </div>
      </div>


      <!-- Prompts Dynamic List Container (Space-y-4 for beautiful card spacing) -->
      <div id="prompts-list-root" class="space-y-4 min-h-[30rem]">
        <!-- Dynamic cards and headers will be rendered here -->
      </div>

      <!-- Error State for CORS/Load failure -->
      <div id="error-state"
        class="hidden flex flex-col items-center justify-center py-16 px-4 bg-rose-50/50 rounded-2xl border border-rose-500/20 shadow-sm text-center">
        <h3 class="text-base font-semibold text-rose-800 mb-2">无法加载同目录的 README.md</h3>
        <p class="text-xs text-slate-500 mt-1 max-w-md mb-6 leading-relaxed">
          由于浏览器的安全策略（CORS 限制），直接双击打开本地 HTML 文件时，网页无法主动读取磁盘上的文件。<br>
          <strong>解决办法：</strong><br>
          1. 运行本地 HTTP 服务器打开此页面（如 <code>python -m http.server</code>）。<br>
          2. 或者直接把同目录下的 <code>README.md</code> 拖拽到本页面任意位置来手动导入。
        </p>
        <div class="flex gap-3 justify-center">
          <button onclick="document.getElementById('local-file-input').click()"
            class="btn-scale px-4 py-2 pride-btn rounded-xl text-xs font-semibold shadow-md flex items-center gap-1.5">
            手动导入 README.md
          </button>
        </div>
      </div>

    </div>
  </main>



  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-md w-full px-4 sm:px-0"></div>

  <!-- JavaScript logic -->
  <script>
    // App Global State
    let rawMarkdown = "";
    let parsedItems = [];

    // Helper to get active site configuration
    function getActiveSiteConfig() {
      const urlParams = new URLSearchParams(window.location.search);
      const siteParam = urlParams.get('site');
      if (siteParam === 'fam') {
        return {
          path: './docs/fam.md',
          filename: 'fam.md'
        };
      }
      return {
        path: './README.md',
        filename: 'README.md'
      };
    }

    // Update dynamic texts based on active site configuration
    function updateDynamicTexts() {
      const config = getActiveSiteConfig();
      const dragOverlayFilename = document.getElementById('drag-overlay-filename');
      if (dragOverlayFilename) {
        dragOverlayFilename.textContent = config.filename;
      }
    }

    // Initialize application
    window.addEventListener('DOMContentLoaded', async () => {
      initDragAndDrop();
      updateDynamicTexts();

      const config = getActiveSiteConfig();
      console.log("当前尝试请求的完整路径是:", new URL(config.path, window.location.href).href);

      let loadedSuccessfully = false;

      // 1. Try to fetch dynamically from server
      try {
        const timestamp = new Date().getTime();
        const response = await fetch(`${config.path}?t=${timestamp}`);
        if (response.ok) {
          rawMarkdown = await response.text();
          loadedSuccessfully = true;
          // Clean up stored local overrides if server fetch works
          localStorage.removeItem('local_readme_content');
          localStorage.removeItem('local_readme_filename');
          localStorage.removeItem('local_readme_updated');
        } else {
          console.warn(`获取 ${config.filename} 失败，HTTP 状态码:`, response.status);
        }
      } catch (err) {
        console.error(`获取 ${config.filename} 发生错误，将尝试本地存储:`, err);
      }

      // 2. Fallback to localStorage if dynamic fetch failed
      if (!loadedSuccessfully) {
        const storedContent = localStorage.getItem('local_readme_content');
        if (storedContent) {
          rawMarkdown = storedContent;
          loadedSuccessfully = true;
          showImportStatus(true);
        }
      }

      // 3. Render page or show error if both failed
      if (loadedSuccessfully) {
        hideErrorOverlay();
        parseAndRender();
      } else {
        showErrorOverlay();
      }
    });

    // Drag & Drop / File Import Handlers
    let dragCounter = 0;

    function initDragAndDrop() {
      window.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragCounter++;
        const overlay = document.getElementById('drag-overlay');
        if (overlay) overlay.classList.remove('hidden');
      });

      window.addEventListener('dragover', (e) => {
        e.preventDefault();
      });

      window.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter === 0) {
          const overlay = document.getElementById('drag-overlay');
          if (overlay) overlay.classList.add('hidden');
        }
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragCounter = 0;
        const overlay = document.getElementById('drag-overlay');
        if (overlay) overlay.classList.add('hidden');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
          const file = files[0];
          readAndApplyFile(file);
        }
      });
    }

    function readAndApplyFile(file) {
      if (!file.name.endsWith('.md')) {
        showToast('请导入以 .md 结尾的 Markdown 文件', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        const content = event.target.result;
        rawMarkdown = content;
        localStorage.setItem('local_readme_content', content);
        localStorage.setItem('local_readme_filename', file.name);
        localStorage.setItem('local_readme_updated', new Date().toLocaleTimeString());

        parseAndRender();
        showImportStatus(true);
        showToast(`${file.name} 导入成功并已更新`, 'success');
      };
      reader.onerror = () => {
        showToast('读取文件失败，请重试', 'error');
      };
      reader.readAsText(file);
    }

    function showImportStatus(show) {
      const banner = document.getElementById('local-mode-banner');
      if (!banner) return;

      const isFileProtocol = window.location.protocol === 'file:';

      if (isFileProtocol) {
        banner.classList.remove('hidden');
        const statusText = document.getElementById('local-mode-status-text');
        const resetBtn = document.getElementById('local-mode-reset-btn');

        const config = getActiveSiteConfig();

        if (show) {
          const filename = localStorage.getItem('local_readme_filename') || config.filename;
          const time = localStorage.getItem('local_readme_updated') || '';

          if (statusText) {
            statusText.innerHTML = `
              <h4 class="font-semibold text-slate-800 text-sm">已载入自定义配置</h4>
              <p class="text-xs text-slate-500 mt-0.5">正在使用导入的 <strong>${filename}</strong> (更新于 ${time})。更改文件后可重新拖入。</p>
            `;
          }
          if (resetBtn) resetBtn.classList.remove('hidden');
        } else {
          if (statusText) {
            statusText.innerHTML = `
              <h4 class="font-semibold text-slate-800 text-sm">本地离线模式</h4>
              <p class="text-xs text-slate-500 mt-0.5">由于浏览器安全限制，无法自动加载您的 ${config.filename} 修改。请拖拽修改后的 ${config.filename} 到此处，或点击导入。</p>
            `;
          }
          if (resetBtn) resetBtn.classList.add('hidden');
        }
      } else {
        banner.classList.add('hidden');
      }
    }

    function resetDefaultReadme() {
      localStorage.removeItem('local_readme_content');
      localStorage.removeItem('local_readme_filename');
      localStorage.removeItem('local_readme_updated');
      window.location.reload();
    }

    // Inline markdown parser
    function parseInline(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-black text-slate-950">$1</strong>')
        .replace(/\*(.*?)\*/g, '<em class="italic text-slate-900">$1</em>')
        .replace(/`([^`]+)`/g, '<code class="bg-slate-100 text-slate-900 px-2 py-0.5 rounded-md text-sm sm:text-base font-mono border border-slate-200">$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-800 hover:underline font-bold transition-colors">$1</a>');
    }

    // Convert markdown text block to styled HTML adhering to enlarged HCI typography standards
    function renderMarkdownToHtml(mdText) {
      if (!mdText.trim()) return '';

      const lines = mdText.split('\n');
      const result = [];
      let inList = null;
      let inTable = false;

      function closeList() {
        if (inList) {
          result.push(`</${inList}>`);
          inList = null;
        }
      }

      function closeTable() {
        if (inTable) {
          result.push('</tbody></table></div>');
          inTable = false;
        }
      }

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        let trimmed = line.trim();

        let isQuote = false;
        if (trimmed.startsWith('>')) {
          isQuote = true;
          trimmed = trimmed.replace(/^>\s?/, '');
        }

        if (trimmed === '---' || trimmed === '***') {
          closeList();
          closeTable();
          result.push('<hr class="my-8 border-slate-200">');
          continue;
        }

        if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
          closeList();
          const cells = trimmed.split('|').slice(1, -1).map(c => c.trim());
          if (cells.every(c => /^:?-+:?$/.test(c))) continue;

          if (!inTable) {
            inTable = true;
            result.push('<div class="overflow-x-auto my-5"><table class="w-full text-sm sm:text-base text-left border-collapse border border-slate-200 rounded-xl overflow-hidden shadow-sm"><thead><tr class="bg-slate-100 text-slate-900 font-bold border-b border-slate-200">');
            cells.forEach(c => result.push(`<th class="px-4.5 py-3.5 border-r border-slate-200 last:border-0 text-base sm:text-lg">${parseInline(c)}</th>`));
            result.push('</tr></thead><tbody>');
          } else {
            result.push('<tr class="border-b border-slate-200/70 last:border-0 hover:bg-slate-50/80 transition-colors">');
            cells.forEach(c => result.push(`<td class="px-4.5 py-3.5 border-r border-slate-200/70 last:border-0 text-slate-800 leading-relaxed">${parseInline(c)}</td>`));
            result.push('</tr>');
          }
          continue;
        } else {
          closeTable();
        }

        if (trimmed.startsWith('# ')) {
          closeList();
          result.push(`<h1 class="text-5xl sm:text-7xl lg:text-8xl font-black tracking-tighter pride-gradient-text my-8 sm:my-12 leading-none select-none">${parseInline(trimmed.substring(2))}</h1>`);
          continue;
        }
        if (trimmed.startsWith('#### ')) {
          closeList();
          result.push(`<h4 class="text-lg sm:text-xl font-bold text-slate-900 my-4">${parseInline(trimmed.substring(5))}</h4>`);
          continue;
        }

        const ulMatch = trimmed.match(/^[-*]\s+(.*)/);
        if (ulMatch) {
          if (inList !== 'ul') {
            closeList();
            inList = 'ul';
            result.push('<ul class="list-disc list-inside space-y-2.5 my-4 text-base sm:text-lg text-slate-800 leading-relaxed">');
          }
          result.push(`<li>${parseInline(ulMatch[1])}</li>`);
          continue;
        }

        const olMatch = trimmed.match(/^\d+\.\s+(.*)/);
        if (olMatch) {
          if (inList !== 'ol') {
            closeList();
            inList = 'ol';
            result.push('<ol class="list-decimal list-inside space-y-2.5 my-4 text-base sm:text-lg text-slate-800 leading-relaxed">');
          }
          result.push(`<li>${parseInline(olMatch[1])}</li>`);
          continue;
        }

        closeList();

        if (trimmed) {
          const inlineContent = parseInline(trimmed);
          if (isQuote) {
            result.push(`<blockquote class="border-l-4 border-slate-300 pl-4.5 py-3 my-3 text-base sm:text-lg text-slate-800 italic bg-slate-50/90 rounded-r-xl">${inlineContent}</blockquote>`);
          } else {
            result.push(`<p class="text-base sm:text-lg text-slate-800 my-3 leading-relaxed">${inlineContent}</p>`);
          }
        }
      }

      closeList();
      closeTable();
      return result.join('');
    }

    // Markdown Parser: H2 for category separators, H3 for subheadings, formatted text, and copyable prompt code blocks
    function parseMarkdown(mdText) {
      const lines = mdText.split(/\r?\n/);
      const items = [];
      let pendingTextLines = [];
      let lastHeadingTitle = "";

      function flushPendingText() {
        if (pendingTextLines.length === 0) return;
        const html = renderMarkdownToHtml(pendingTextLines.join('\n'));
        if (html.trim()) {
          items.push({ type: 'html', content: html });
        }
        pendingTextLines = [];
      }

      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        const cleanLine = line.trim();

        if (cleanLine === '[TOC]') {
          flushPendingText();
          items.push({ type: 'toc' });
          i++;
          continue;
        }

        // Match Code Block: ```
        if (/^`{3}(?!`)/.test(cleanLine)) {
          flushPendingText();
          const codeLines = [];
          i++;
          while (i < lines.length) {
            if (/^`{3}(?!`)/.test(lines[i].trim())) {
              i++;
              break;
            }
            codeLines.push(lines[i]);
            i++;
          }
          const code = codeLines.join('\n');

          let title = lastHeadingTitle || "一键复制 Prompt";
          if (items.length > 0 && items[items.length - 1].type === 'h3_heading') {
            title = items[items.length - 1].title;
            items.pop();
          }

          items.push({ type: 'prompt', title, code });
          lastHeadingTitle = "";
          continue;
        }

        // Match Level 2 Heading (## Category)
        if (cleanLine.startsWith('## ')) {
          flushPendingText();
          const title = cleanLine.substring(3).trim();
          items.push({ type: 'h2', title });
          lastHeadingTitle = title;
          i++;
          continue;
        }

        // Match Level 3 Heading (### Title)
        if (cleanLine.startsWith('### ')) {
          flushPendingText();
          const title = cleanLine.substring(4).trim();
          items.push({ type: 'h3_heading', title });
          lastHeadingTitle = title;
          i++;
          continue;
        }

        pendingTextLines.push(line);
        i++;
      }

      flushPendingText();
      return { items };
    }

    // Core parsing and rendering controller
    function parseAndRender() {
      const parsed = parseMarkdown(rawMarkdown);
      parsedItems = parsed.items;
      renderExplorer();
    }

    // Smooth Scroll Helper
    function scrollToSection(event, id) {
      if (event) event.preventDefault();
      const el = document.getElementById(id);
      if (el) {
        const headerOffset = 40;
        const elementPosition = el.getBoundingClientRect().top;
        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

        window.scrollTo({
          top: offsetPosition,
          behavior: "smooth"
        });
      }
    }

    // Dynamic rendering of flat Prompt Explorer list as Responsive Square Card Grid with Pride Solid Color Themes
    function renderExplorer() {
      const root = document.getElementById('prompts-list-root');
      if (!root) return;
      root.innerHTML = "";

      const prideColorThemes = [
        'pride-card-red',
        'pride-card-orange',
        'pride-card-yellow',
        'pride-card-green',
        'pride-card-blue',
        'pride-card-purple'
      ];
      let promptCounter = 0;

      let i = 0;
      while (i < parsedItems.length) {
        const item = parsedItems[i];

        if (item.type === 'toc') {
          const categories = parsedItems.filter(it => it.type === 'h2');
          if (categories.length > 0) {
            const tocEl = document.createElement('div');
            tocEl.className = "bg-white p-6 sm:p-8 rounded-3xl border-2 border-slate-200 shadow-sm my-6 select-none w-full";

            let tocHtml = `
              <div class="flex items-center gap-2 text-sm sm:text-base font-bold text-slate-500 uppercase tracking-wider mb-4">
                <span>📌</span> 目录
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
            `;

            categories.forEach((catItem) => {
              const catIdx = parsedItems.indexOf(catItem);
              tocHtml += `
                <a href="#category-${catIdx}" data-target="category-${catIdx}"
                  class="toc-item-link flex items-center justify-between px-6 sm:px-7 py-4 rounded-2xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-900 hover:text-slate-950 transition-all text-base sm:text-lg font-extrabold group shadow-xs">
                  <span class="truncate pr-3">${parseInline(catItem.title)}</span>
                  <span class="text-slate-400 group-hover:translate-x-1 transition-transform shrink-0">→</span>
                </a>
              `;
            });

            tocHtml += `</div>`;
            tocEl.innerHTML = tocHtml;

            tocEl.querySelectorAll('.toc-item-link').forEach(link => {
              link.addEventListener('click', (e) => {
                const targetId = link.getAttribute('data-target');
                scrollToSection(e, targetId);
              });
            });

            root.appendChild(tocEl);
          }
          i++;
        } else if (item.type === 'h2') {
          const h2El = document.createElement('h2');
          h2El.className = "text-2xl sm:text-3xl font-extrabold text-slate-950 pt-10 pb-4 border-b-2 border-slate-200/90 mt-10 first:mt-3 select-none w-full";
          h2El.id = `category-${i}`;
          h2El.innerHTML = parseInline(item.title);
          root.appendChild(h2El);
          i++;
        } else if (item.type === 'h3_heading') {
          const h3El = document.createElement('h3');
          h3El.className = "text-lg sm:text-xl font-bold text-slate-900 mt-8 mb-4 select-none w-full";
          h3El.innerHTML = parseInline(item.title);
          root.appendChild(h3El);
          i++;
        } else if (item.type === 'html') {
          const div = document.createElement('div');
          div.className = "text-base sm:text-lg text-slate-800 leading-relaxed my-3 w-full";
          div.innerHTML = item.content;
          root.appendChild(div);
          i++;
        } else if (item.type === 'prompt') {
          // Collect consecutive prompt cards into a responsive grid (2 columns on mobile, max 3 columns on web)
          const promptGroup = [];
          while (i < parsedItems.length && parsedItems[i].type === 'prompt') {
            promptGroup.push({ item: parsedItems[i], idx: i });
            i++;
          }

          const gridEl = document.createElement('div');
          gridEl.className = "grid grid-cols-2 sm:grid-cols-3 gap-3.5 sm:gap-5 my-5 w-full";

          promptGroup.forEach(({ item: promptItem, idx: promptIdx }) => {
            const promptId = `prompt-${promptIdx}`;
            const promptEl = document.createElement('div');

            const colorTheme = prideColorThemes[promptCounter % 6];
            promptCounter++;

            promptEl.className = `group/card pride-card ${colorTheme} aspect-square p-3.5 sm:p-5 lg:p-6 rounded-2xl sm:rounded-3xl shadow-sm flex flex-col justify-between cursor-pointer relative overflow-hidden transition-all duration-300 select-none btn-scale`;
            promptEl.id = promptId;

            promptEl._promptCode = promptItem.code;
            promptEl._promptTitle = promptItem.title;

            promptEl.innerHTML = `
              <div class="card-content-wrap flex flex-col justify-between h-full w-full">
                <div class="w-full text-left overflow-hidden">
                  <h3 class="text-lg sm:text-xl md:text-2xl lg:text-2xl font-black line-clamp-4 sm:line-clamp-5 leading-snug tracking-tight break-words">
                    ${parseInline(promptItem.title)}
                  </h3>
                </div>
                <div class="flex items-center justify-end w-full mt-auto pt-2">
                  <span class="clipboard-icon text-xl sm:text-2xl opacity-80 group-hover/card:opacity-100 group-hover/card:scale-110 transition-all select-none">📋</span>
                </div>
              </div>
              <div class="copied-overlay hidden absolute inset-0 flex items-center justify-center pointer-events-none select-none">
                <span class="text-6xl sm:text-7xl font-black text-white transform scale-110 transition-transform">✓</span>
              </div>
            `;

            promptEl.addEventListener('click', () => {
              copyPromptCard(promptEl._promptCode, promptId, promptEl._promptTitle);
            });

            gridEl.appendChild(promptEl);
          });

          root.appendChild(gridEl);
        } else {
          i++;
        }
      }
    }

    // Clipboard Copy Execution with Synchronous 0ms INSTANT UI Feedback
    function copyPromptCard(text, promptId, title) {
      const cardEl = document.getElementById(promptId);

      // 1. INSTANT UI FEEDBACK (0ms synchronous execution!)
      showCopyFeedback(cardEl, title);

      // 2. Clipboard API execution in background
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(err => {
          console.error('Clipboard copy error: ', err);
          showToast('复制失败，请尝试手动复制', 'error');
        });
      } else {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        } catch (err) {
          console.error('Fallback copy failed: ', err);
          showToast('复制失败，请尝试手动复制', 'error');
        }
      }
    }

    // Clipboard UI feedback controller: Card instantly turns green, text disappears, centered huge checkmark ✓ appears
    function showCopyFeedback(cardEl, title) {
      if (!cardEl) return;

      if (cardEl.copyTimeout) {
        clearTimeout(cardEl.copyTimeout);
      }

      cardEl.classList.add('copied');

      cardEl.copyTimeout = setTimeout(() => {
        cardEl.classList.remove('copied');
      }, 2000);
    }

    // Toast Alert Manager
    function showToast(message, type = 'success', subtitle = '') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');

      if (message === '复制成功') {
        const wrapper = document.createElement('div');
        wrapper.className = "fixed inset-0 z-50 flex items-center justify-center pointer-events-none";

        toast.className = `
          px-6 py-3 rounded-2xl shadow-xl bg-green-600 text-white text-sm font-bold backdrop-blur-sm transform scale-90 opacity-0 transition-all duration-200 ease-out flex items-center justify-center
        `;
        toast.innerHTML = `<span>${message}</span>`;
        wrapper.appendChild(toast);
        document.body.appendChild(wrapper);

        requestAnimationFrame(() => {
          toast.classList.remove('scale-90', 'opacity-0');
        });

        setTimeout(() => {
          toast.classList.add('opacity-0', 'scale-90');
          toast.addEventListener('transitionend', () => {
            wrapper.remove();
          });
        }, 1500);
        return;
      }

      toast.className = `
        flex items-start justify-between gap-3 p-4.5 rounded-2xl shadow-lg border backdrop-blur-md transform translate-y-2 opacity-0 transition-all duration-300 ease-out max-w-sm w-full
        ${type === 'success'
          ? 'pride-gradient-bg text-white border-transparent shadow-md shadow-orange-500/5'
          : 'bg-white/95 border-rose-500/30 text-slate-800 shadow-rose-500/5'}
      `;

      toast.innerHTML = `
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold leading-relaxed">${message}</p>
          ${subtitle ? `<p class="text-xs ${type === 'success' ? 'text-white/80' : 'text-slate-400'} mt-0.5 truncate">${subtitle}</p>` : ''}
        </div>
        <button class="${type === 'success' ? 'text-white/80 hover:text-white' : 'text-slate-400 hover:text-slate-600'} transition-colors font-bold text-sm" onclick="this.parentElement.remove()">
          &times;
        </button>
      `;

      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        toast.addEventListener('transitionend', () => {
          toast.remove();
        });
      }, 3500);
    }

    function showErrorOverlay() {
      const errorState = document.getElementById('error-state');
      const root = document.getElementById('prompts-list-root');
      if (!errorState) return;

      const config = getActiveSiteConfig();
      const errorTitle = errorState.querySelector('h3');
      if (errorTitle) errorTitle.textContent = `无法加载同目录的 ${config.filename}`;

      const errorDesc = errorState.querySelector('p');
      if (errorDesc) {
        errorDesc.innerHTML = `
          由于浏览器的安全策略（CORS 限制），直接双击打开本地 HTML 文件时，网页无法主动读取磁盘上的文件。<br>
          <strong>解决办法：</strong><br>
          1. 运行本地 HTTP 服务器打开此页面（如 <code>python -m http.server</code>）。<br>
          2. 或者直接把同目录下的 <code>${config.filename}</code> 拖拽到本页面任意位置来手动导入。
        `;
      }

      const errorBtn = errorState.querySelector('button');
      if (errorBtn) {
        errorBtn.textContent = `手动导入 ${config.filename}`;
      }

      errorState.classList.remove('hidden');
      if (root) root.classList.add('hidden');
      showImportStatus(false);
    }

    function hideErrorOverlay() {
      const errorState = document.getElementById('error-state');
      const root = document.getElementById('prompts-list-root');

      if (errorState) errorState.classList.add('hidden');
      if (root) root.classList.remove('hidden');
    }
  </script>
