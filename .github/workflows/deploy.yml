# 构建 + 自动部署（Cloudflare Pages）
#
# 部署链路：GitHub Actions 构建 → wrangler 上传产物到 Cloudflare Pages。
#
# ⚠️ 二选一，不要两条都开：
#   本工作流已经负责部署；如果 Cloudflare Pages 控制台里也开了 Git 集成，
#   每次 push 会触发两次部署（互相覆盖）。请在 Pages → 项目 → Settings 里
#   断开 Git 连接，只保留这边的 Actions 部署。
#
# 需要的仓库配置（Settings → Secrets and variables → Actions）：
#   Secrets:   CLOUDFLARE_API_TOKEN（权限含 Cloudflare Pages:Edit）
#              CLOUDFLARE_ACCOUNT_ID
#   Variables: CLOUDFLARE_PAGES_PROJECT（Pages 项目名，例如 prompt）
# 没配齐时构建照常跑，部署步骤自动跳过并给出 notice —— 不会红叉。

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连续 push 只保留最新一次，避免并发部署互相覆盖
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：读代码 + 写部署记录 + GitHub Pages 部署
permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          # 与 .node-version / .nvmrc 保持一致；Vite 6 需要 Node 18+
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm ci：严格按 package-lock.json 安装，保证与本地结果完全一致
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        # 冒烟检查：产物齐全、snippets 真的打进包里、没有会 404 的绝对路径
        run: npm run verify

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # PR 只做构建校验，不部署；只有 main 分支的 push / 手动触发才部署
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      # secrets / vars 上下文不能出现在 if: 表达式里（GitHub 会直接拒绝解析整个
      # workflow，报 "Unrecognized named-value: 'secrets'"）。所以凭据是否配置，
      # 改为在 shell 里通过 env 判断（env 里可以用 secrets），而不是写在 if: 上。
      - name: Ensure Pages project exists
        # wrangler pages deploy 在非交互环境下不会自动创建项目（会直接报
        # "The Pages project ... does not exist"），所以先显式创建；已存在时忽略报错
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --production-branch=main 2>&1 | grep -v "already exists" || true

      - name: Deploy
        id: deploy
        # 凭据缺失时 wrangler 会失败；continue-on-error 把它降级为"跳过部署"，
        # 由下一步区分"没配置凭据"和"配置错了"，不该红叉的时候不红叉
        continue-on-error: true
        # 固定版本，避免 action 上游变更导致部署突然失败
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Check deploy outcome
        if: always() && steps.deploy.outcome != 'success'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_PROJECT" ]; then
            echo "::notice::未配置 Cloudflare 部署凭据，已跳过部署。请在仓库 Settings → Secrets and variables → Actions 中添加 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（Secrets）与 CLOUDFLARE_PAGES_PROJECT（Variables）。"
          else
            echo "::error::已配置凭据但部署失败，请检查 Cloudflare 令牌权限与 Pages 项目名是否正确。"
            exit 1
          fi

  # 部署到 GitHub Pages（https://bexino.github.io/prompt/），与 Cloudflare 互不影响。
  # configure-pages 的 enablement=true 会通过 API 自动启用 Pages（首次），
  # 免去手动去仓库 Settings 里开的步骤。
  deploy-gh-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
